<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <!-- [PWA优化] viewport: shrink-to-fit=no 防 iOS 自动缩小，viewport-fit=cover 适配刘海屏 safe area -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>MeriMark 救生圈</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#121212" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/editor.css" />
    <link rel="stylesheet" href="./css/list.css" />
    <link rel="stylesheet" href="./css/context-menu.css" />
    <link rel="stylesheet" href="./css/modal.css" />
    <link rel="stylesheet" href="./css/lifeboat.css" />
    <link rel="stylesheet" href="./css/pwa-safe-area.css" />

    <script>
      if (window.navigator.standalone === true) {
        document.documentElement.classList.add('ios-standalone');
      }

      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
      document.addEventListener('gestureend', function (e) { e.preventDefault(); });
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (event) {
        let now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) event.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
    </script>
  </head>
  <body>
    <div id="editorWrapper" class="editor-wrapper theme-diary">
      <div class="mode-switch" id="modeSwitch">
        <div class="mode-option active" data-type="日记">📝 日记</div>
        <div class="mode-option" data-type="任务">⚡ 任务</div>
        <div class="mode-option" data-type="便条">📌 便条</div>
      </div>

      <div class="textarea-container">
        <textarea id="inputArea" placeholder="🛟 MeriMark 应急救生圈&#10;仅在主 PWA 无法使用时记录内容…"></textarea>
        <div class="custom-scrollbar" id="editorScrollbar"><div class="custom-scrollbar-thumb"></div></div>
      </div>

      <div class="btn-group">
        <button class="btn-save" id="btnSave" onclick="saveNote()">保存日记</button>
        <button class="btn-cancel" id="btnCancel" onclick="cancelEdit()">取消</button>
        <button class="btn-sync" id="btnSync" onclick="exportAll()">导出</button>
        <button class="btn-more" id="btnMore" onclick="showLifeboatMenu()" aria-label="更多操作" aria-haspopup="dialog">…</button>
      </div>
      <div class="word-count-bar" id="wordCountBar">字数: 0</div>
    </div>

    <div class="list-header" id="listHeader">
      <div class="list-header-left">
          待导出:
          <span id="statDiary">日记 0</span><span class="sep">|</span>
          <span id="statTask">任务 0</span><span class="sep">|</span>
          <span id="statNote">便条 0</span>
      </div>
      <div class="list-header-right"><span id="statTotalChars">0字</span></div>
    </div>

    <div class="list-container">
      <ul id="noteList"></ul>
      <div class="custom-scrollbar" id="listScrollbar"><div class="custom-scrollbar-thumb"></div></div>
    </div>
    <div id="lifeboatMenuMask" class="lifeboat-menu-mask" onclick="hideLifeboatMenu()"></div>
    <div id="lifeboatMenu" class="lifeboat-menu" role="dialog" aria-modal="true" aria-label="更多操作" aria-hidden="true">
      <div class="lifeboat-menu-handle" aria-hidden="true"></div>
      <button class="lifeboat-menu-import" id="btnImportBackup" onclick="showImportBackup()">导入备份</button>
      <button class="lifeboat-menu-danger" id="btnClearAll" onclick="clearAllLifeboatData()">清除全部本地内容</button>
      <button class="lifeboat-menu-cancel" onclick="hideLifeboatMenu()">取消</button>
    </div>

    <div id="importBackupModal" class="modal-overlay" aria-hidden="true">
      <div class="import-backup-card" role="dialog" aria-modal="true" aria-labelledby="importBackupTitle">
        <div class="modal-title" id="importBackupTitle">导入 Lifeboat 备份</div>
        <div class="import-backup-message">仅可恢复到当前完全为空的救生圈。请粘贴 Safari 中“导出”得到的完整 JSON。</div>
        <textarea
          id="importBackupTextarea"
          class="import-backup-textarea"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          autocorrect="off"
          placeholder="在这里粘贴 MeriMark Lifeboat JSON…"
          aria-label="Lifeboat 备份 JSON"
        ></textarea>
        <div class="import-backup-status" id="importBackupStatus" aria-live="polite"></div>
        <div class="modal-actions">
          <button class="modal-btn modal-btn-cancel" onclick="hideImportBackup()">取消</button>
          <button class="modal-btn modal-btn-confirm" id="btnConfirmImportBackup" onclick="prepareImportBackup()">检查并恢复</button>
        </div>
      </div>
    </div>

    <div id="contextMask" class="context-mask" onclick="hideContextMenu()"></div>
    <div id="contextMenu" class="context-menu">
      <div class="context-btn context-btn-duplicate" onclick="actionDuplicate()"><i>📄</i><span>复印</span></div>
      <div class="context-btn context-btn-copy" onclick="actionCopyClipboard()"><i>📋</i><span>复制</span></div>
    </div>

    <div id="customModal" class="modal-overlay">
      <div class="modal-card">
        <div class="modal-title" id="modalTitle">标题</div>
        <div class="modal-message" id="modalMessage">内容</div>
        <div class="modal-code-field" id="modalCodeField" hidden>
          <div class="modal-code-label">确认码</div>
          <div class="modal-code-value" id="modalCodeValue">000</div>
          <input
            id="modalCodeInput"
            class="modal-code-input"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="3"
            autocomplete="off"
            aria-label="输入三位确认码"
            placeholder="输入上方三位数字"
          />
          <div class="modal-code-hint">输入完全一致后才能清除</div>
        </div>
        <div class="modal-actions">
          <button class="modal-btn modal-btn-cancel" id="modalBtnCancel">取消</button>
          <button class="modal-btn modal-btn-confirm" id="modalBtnConfirm">确定</button>
        </div>
      </div>
    </div>

    <div id="logModal" class="modal-overlay">
      <div class="log-modal-card">
        <div class="modal-title" id="logModalTitle">详细日志</div>
        <textarea id="logModalTextarea" class="log-textarea" readonly></textarea>
        <div class="modal-actions">
          <button class="modal-btn modal-btn-cancel" onclick="hideLogModal()">关闭</button>
          <button class="modal-btn modal-btn-confirm" onclick="copyLog()">复制日志</button>
        </div>
      </div>
    </div>

    <script src="./js/state-core.js"></script>
    <script src="./js/state-and-markdown.js"></script>
    <script src="./js/editor.js"></script>
    <script src="./js/list-and-context.js"></script>
    <script src="./js/modals.js"></script>
    <script src="./js/lifeboat.js"></script>
  </body>
</html>
