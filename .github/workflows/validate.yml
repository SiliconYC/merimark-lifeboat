name: Validate lifeboat

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          for f in js/*.js service-worker.js; do node --check "$f"; done
      - name: Validate static files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          m = json.loads((root / 'manifest.webmanifest').read_text(encoding='utf-8'))
          assert m['start_url'] == './' and m['scope'] == './' and m['display'] == 'standalone'
          required = [
              'index.html', 'service-worker.js', 'manifest.webmanifest', '.nojekyll',
              'css/base.css', 'css/editor.css', 'css/list.css', 'css/context-menu.css', 'css/modal.css', 'css/lifeboat.css',
              'js/state-core.js', 'js/state-and-markdown.js', 'js/editor.js', 'js/list-and-context.js', 'js/modals.js', 'js/lifeboat.js',
              'icons/icon-192.png', 'icons/icon-512.png', 'icons/apple-touch-icon.png'
          ]
          missing = [p for p in required if not (root / p).exists()]
          assert not missing, missing
          html = (root / 'index.html').read_text(encoding='utf-8')
          assert '待导出:' in html and 'exportAll()' in html and 'clearAllLifeboatData()' in html
          print('validation passed')
          PY
