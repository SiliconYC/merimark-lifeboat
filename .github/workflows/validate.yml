name: Validate lifeboat

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check db.js
          node --check service-worker.js

      - name: Validate manifest and required files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          manifest = json.loads((root / 'manifest.webmanifest').read_text(encoding='utf-8'))
          assert manifest['start_url'] == './'
          assert manifest['scope'] == './'
          assert manifest['display'] == 'standalone'

          required = [
              'index.html', 'styles.css', 'app.js', 'db.js',
              'service-worker.js', 'manifest.webmanifest', '.nojekyll',
              'icons/lifeboat.svg', 'icons/icon-192.png',
              'icons/icon-512.png', 'icons/apple-touch-icon.png',
          ]
          missing = [path for path in required if not (root / path).exists()]
          assert not missing, f'Missing required files: {missing}'

          sw = (root / 'service-worker.js').read_text(encoding='utf-8')
          for path in required[0:6] + required[7:]:
              if path == 'service-worker.js':
                  continue
              expected = './' + path
              if path in {'index.html'}:
                  expected = './index.html'
              assert expected in sw or path in {'styles.css'}, f'Service worker may not cache {path}'
          print('MeriMark Lifeboat validation passed.')
          PY
